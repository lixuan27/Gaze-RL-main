[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-rl"
version = "1.0.0"
description = "Gaze-RL: learning where rewards land in multimodal reasoning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
infer = ["transformers>=4.56", "accelerate", "pillow", "av"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gaze_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
